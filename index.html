:root {
  --accent-base: #0078d4;
  --font: "Segoe UI Variable Text", "Segoe UI Variable", "W11 Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable", "W11 Text", "Segoe UI", system-ui, sans-serif;
  --icons: "Segoe Fluent Icons", "W11 Icons", "Segoe MDL2 Assets";
  --radius: 4px;
  --radius-lg: 8px;
}
/* Light */
:root, :root[data-theme="light"] {
  --bg: #f3f3f3;
  --bg-solid: #f9f9f9;
  --card: rgba(255,255,255,.70);
  --card-hover: rgba(249,249,249,.50);

  --card-stroke: rgba(0,0,0,.0578);
  --card-inner: rgba(0,0,0,.024);
  --divider: rgba(0,0,0,.0803);
  --text: rgba(0,0,0,.896);
  --text2: rgba(0,0,0,.606);
  --text3: rgba(0,0,0,.446);
  --text-dis: rgba(0,0,0,.361);
  --subtle-hover: rgba(0,0,0,.0373);
  --subtle-press: rgba(0,0,0,.0241);
  --ctl: rgba(255,255,255,.70);
  --ctl-hover: rgba(249,249,249,.50);
  --ctl-press: rgba(249,249,249,.30);
  --ctl-stroke: rgba(0,0,0,.0578);
  --ctl-stroke-bottom: rgba(0,0,0,.1622);
  --ctl-strong: rgba(0,0,0,.446);
  --input-bg: rgba(255,255,255,.70);
  --input-focus: #fff;
  --flyout: #f9f9f9;
  --flyout-stroke: rgba(0,0,0,.0578);
  --shadow: 0 8px 16px rgba(0,0,0,.14);
  --shadow-dialog: 0 32px 64px rgba(0,0,0,.1876), 0 2px 21px rgba(0,0,0,.1474);
  --smoke: rgba(0,0,0,.30);
  --accent: #005fb8;
  --accent-hover: #1a6fc0;
  --accent-press: #3381c7;
  --on-accent: #fff;
  --accent-text: #005a9e;
  --toggle-off-knob: rgba(0,0,0,.606);
  --scroll: rgba(0,0,0,.45);
  --hero: rgba(255,255,255,.5);
  color-scheme: light;
}

    --subtle-hover: rgba(255,255,255,.0605); --subtle-press: rgba(255,255,255,.0419);
    --ctl: rgba(255,255,255,.0605); --ctl-hover: rgba(255,255,255,.0837); --ctl-press: rgba(255,255,255,.0326);
    --ctl-stroke: rgba(255,255,255,.0698); --ctl-stroke-bottom: rgba(255,255,255,.0465); --ctl-strong: rgba(255,255,255,.545);
    --input-bg: rgba(255,255,255,.0605); --input-focus: rgba(30,30,30,.7);
    --flyout: #2c2c2c; --flyout-stroke: rgba(0,0,0,.2);
    --shadow: 0 8px 16px rgba(0,0,0,.26); --shadow-dialog: 0 32px 64px rgba(0,0,0,.37), 0 2px 21px rgba(0,0,0,.37);
    --smoke: rgba(0,0,0,.30);
    --accent: #4cc2ff; --accent-hover: #47b1e8; --accent-press: #42a1d2; --on-accent: #000; --accent-text: #99ebff;
    --toggle-off-knob: rgba(255,255,255,.786); --scroll: rgba(255,255,255,.5); --hero: rgba(255,255,255,.04);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202020; --bg-solid: #1c1c1c;
  --card: rgba(255,255,255,.0512); --card-hover: rgba(255,255,255,.0837); --card-press: rgba(255,255,255,.0326);
  --card-stroke: rgba(0,0,0,.10); --card-inner: rgba(255,255,255,.03); --divider: rgba(255,255,255,.0837);
  --text: #fff; --text2: rgba(255,255,255,.786); --text3: rgba(255,255,255,.545); --text-dis: rgba(255,255,255,.3628);
  --subtle-hover: rgba(255,255,255,.0605); --subtle-press: rgba(255,255,255,.0419);
  --ctl: rgba(255,255,255,.0605); --ctl-hover: rgba(255,255,255,.0837); --ctl-press: rgba(255,255,255,.0326);
  --ctl-stroke: rgba(255,255,255,.0698); --ctl-stroke-bottom: rgba(255,255,255,.0465); --ctl-strong: rgba(255,255,255,.545);
  --input-bg: rgba(255,255,255,.0605); --input-focus: rgba(30,30,30,.7);
  --flyout: #2c2c2c; --flyout-stroke: rgba(0,0,0,.2);
  --shadow: 0 8px 16px rgba(0,0,0,.26); --shadow-dialog: 0 32px 64px rgba(0,0,0,.37), 0 2px 21px rgba(0,0,0,.37);
  --smoke: rgba(0,0,0,.30);
  --accent: #4cc2ff; --accent-hover: #47b1e8; --accent-press: #42a1d2; --on-accent: #000; --accent-text: #99ebff;
  --toggle-off-knob: rgba(255,255,255,.786); --scroll: rgba(255,255,255,.5); --hero: rgba(255,255,255,.04);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 20px;
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
.g { font-family: var(--icons); font-style: normal; font-weight: normal; line-height: 1; display: inline-flex; align-items: center; justify-content: center; speak: never; }

/* ===== Window ===== */
#app { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; }
.titlebar { display: flex; align-items: center; height: 48px; -webkit-app-region: drag; position: relative; z-index: 5; }
.tb-back, .tb-ham { width: 40px; height: 36px; margin-left: 4px; border: 0; background: transparent; border-radius: var(--radius); font-size: 12px; cursor: default; color: var(--text); }
.tb-back:hover:not(:disabled), .tb-ham:hover { background: var(--subtle-hover); }
.tb-back:active:not(:disabled), .tb-ham:active { background: var(--subtle-press); color: var(--text2); }
.tb-back:disabled { color: var(--text-dis); }
.tb-ham { display: none; font-size: 16px; margin-left: 0; }
.tb-icon { width: 16px; height: 16px; margin: 0 12px 0 8px; }
.tb-title { font-size: 12px; line-height: 16px; }
.tb-search-wrap { display: none; }
.caption { margin-left: auto; display: flex; align-self: flex-start; }
.caption button { width: 46px; height: 32px; border: 0; background: transparent; font-size: 10px; color: var(--text); }
.caption button:hover { background: var(--subtle-hover); }
.caption button.close:hover { background: #c42b1c; color: #fff; }
.caption button.close:active { background: #c83c31; color: rgba(255,255,255,.7); }

.body { display: grid; grid-template-columns: 320px 1fr; min-height: 0; }

/* ===== Navigation pane ===== */
.nav { display: flex; flex-direction: column; min-height: 0; padding: 0 0 0 0; }
.user { display: flex; align-items: center; gap: 16px; padding: 8px 16px 16px 20px; border-radius: var(--radius); margin: 0 8px 0 4px; cursor: default; }
.user:hover { background: var(--subtle-hover); }
.avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px; font-family: var(--font-display); font-weight: 600; color: #fff; background: linear-gradient(135deg,#6b69d6,#0078d4); overflow: hidden; }
.user .name { font-size: 14px; font-weight: 600; line-height: 20px; }
.user .mail { font-size: 12px; line-height: 16px; color: var(--text2); }
.search { position: relative; margin: 0 16px 12px 16px; }
.search input {
  width: 100%; height: 32px; border-radius: var(--radius); border: 1px solid var(--ctl-stroke); border-bottom-color: var(--ctl-strong);
  background: var(--input-bg); color: var(--text); font: inherit; padding: 0 36px 2px 11px; outline: none;
}
.search input::placeholder { color: var(--text2); }
.search input:hover { background: var(--ctl-hover); }
.search input:focus { background: var(--input-focus); border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.search .sbtn { position: absolute; right: 4px; top: 4px; width: 28px; height: 24px; border: 0; background: transparent; border-radius: var(--radius); font-size: 12px; color: var(--text2); transform: scaleX(-1); }
.search .sbtn:hover { background: var(--subtle-hover); }
.suggest { position: absolute; top: 34px; left: 0; right: 0; background: var(--flyout); border: 1px solid var(--flyout-stroke); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 4px 0; z-index: 30; display: none; max-height: 420px; overflow: auto; }
.suggest.show { display: block; }
.suggest .si { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; margin: 0 4px; border-radius: var(--radius); cursor: default; }
.suggest .si:hover, .suggest .si.hl { background: var(--subtle-hover); }
.suggest .si .g { font-size: 16px; width: 16px; }
.suggest .si .sub { color: var(--text2); font-size: 12px; margin-left: auto; white-space: nowrap; }
.suggest .none { padding: 8px 16px; color: var(--text2); }

.navlist { overflow-y: auto; padding: 0 8px 12px 4px; flex: 1; }
.ni { position: relative; display: flex; align-items: center; height: 36px; margin: 3px 4px 3px 12px; padding: 0 12px 0 16px; border-radius: var(--radius); cursor: default; gap: 16px; }
.ni:hover { background: var(--subtle-hover); }
.ni:active { background: var(--subtle-press); color: var(--text2); }
.ni.cur { background: var(--subtle-hover); }
.ni.cur::before { content: ""; position: absolute; left: 0; top: 9px; height: 16px; width: 3px; border-radius: 2px; background: var(--accent); animation: pill .25s cubic-bezier(0,0,0,1); }
@keyframes pill { from { transform: scaleY(.2); } to { transform: none; } }
.ni .nicon { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }
.ni .nicon svg { width: 20px; height: 20px; display: block; }

/* ===== Content ===== */
.content { overflow-y: auto; min-height: 0; position: relative; scroll-behavior: auto; }
.page { max-width: 1064px; padding: 0 40px 40px 40px; margin: 0 auto 0 0; }
.page.enter { animation: enter .3s cubic-bezier(0,0,0,1); }
@keyframes enter { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
.crumb { font-family: var(--font-display); font-size: 28px; line-height: 36px; font-weight: 600; padding: 2px 0 26px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0; position: sticky; top: 0; z-index: 3; background: var(--bg); margin: 0 -4px; padding-left: 4px; }
.crumb .c { cursor: default; color: var(--text2); border-radius: var(--radius); }
.crumb .c:hover { color: var(--text3); }
.crumb .c:active { color: var(--text-dis); }
.crumb .c.cur { color: var(--text); }
.crumb .c.cur:hover { color: var(--text); }
.crumb .sep { font-family: var(--icons); font-size: 16px; color: var(--text2); margin: 4px 12px 0; }
.content.scrolled .crumb { }

.grp { font-size: 14px; font-weight: 600; line-height: 20px; margin: 28px 0 8px 1px; }
.grp:first-child { margin-top: 0; }
.para { color: var(--text2); margin: 0 0 12px 1px; max-width: 780px; }

.card { background: var(--card); border: 1px solid var(--card-stroke); border-radius: var(--radius); background-clip: padding-box; }
.stack > * + * { margin-top: 4px; }
.row { display: flex; align-items: center; min-height: 68px; padding: 12px 16px; gap: 16px; position: relative; }
.row.compact { min-height: 48px; padding-top: 8px; padding-bottom: 8px; }
.row.click { cursor: default; }
.row.click:hover { background: var(--card-hover); }
.row.click:active { background: var(--card-press); }
.row.click:active > .txt { color: var(--text2); }
.row > .ico { font-size: 20px; width: 20px; height: 20px; flex: none; margin-left: 2px; margin-right: 4px; }
.row > .ico.img { width: 32px; height: 32px; border-radius: 4px; font-size: 18px; margin-left: -4px; margin-right: 0; }
.row > .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.row .h { line-height: 20px; }
.row .d { font-size: 12px; line-height: 16px; color: var(--text2); margin-top: 1px; }
.row .d a, .lnk { color: var(--accent-text); text-decoration: none; cursor: pointer; }
.row .d a:hover, .lnk:hover { text-decoration: underline; }
.row > .ctl { display: flex; align-items: center; gap: 12px; flex: none; color: var(--text2); }
.row > .ctl .val { color: var(--text2); }
.row .chev { font-size: 12px; width: 32px; height: 32px; color: var(--text); margin-right: -8px; }
.row .chev.ext { font-size: 14px; }
.row.dis { color: var(--text-dis); pointer-events: none; }
.row.dis .d { color: var(--text-dis); }

/* Expander */
.exp > .row .xchev { width: 32px; height: 32px; border-radius: var(--radius); font-size: 12px; color: var(--text); margin-right: -8px; transition: transform .2s; }
.exp > .row { cursor: default; }
.exp > .row:hover { background: var(--card-hover); }
.exp > .row:hover .xchev { background: var(--subtle-hover); }
.exp.open > .row { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.exp.open > .row .xchev { transform: rotate(180deg); }
.exp-body { display: none; border: 1px solid var(--card-stroke); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); background: var(--card-inner); background-clip: padding-box; }
.exp.open .exp-body { display: block; animation: expand .25s cubic-bezier(0,0,0,1); }
@keyframes expand { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
.exp-body > .sub { display: flex; align-items: center; min-height: 48px; padding: 8px 16px 8px 58px; gap: 16px; }
.exp-body > .sub + .sub { border-top: 1px solid var(--divider); }
.exp-body > .sub.noico { padding-left: 16px; }
.exp-body > .sub .txt { flex: 1; }
.exp-body > .sub.click:hover { background: var(--subtle-hover); }
.exp-body > .sub.block { display: block; padding-top: 16px; padding-bottom: 16px; }

/* ===== Controls ===== */
.tgl { display: flex; align-items: center; gap: 12px; cursor: default; color: var(--text); }
.tgl .lbl { min-width: 24px; text-align: right; }
.sw { width: 40px; height: 20px; border-radius: 10px; border: 1px solid var(--ctl-strong); background: rgba(0,0,0,.024); position: relative; transition: background .15s; flex: none; }
.sw::after { content: ""; position: absolute; width: 12px; height: 12px; top: 3px; left: 3px; border-radius: 50%; background: var(--toggle-off-knob); transition: left .17s cubic-bezier(.2,0,0,1), width .1s, height .1s, top .1s; }
.tgl:hover .sw { background: var(--subtle-hover); }
.tgl:hover .sw::after { width: 14px; height: 14px; top: 2px; left: 2px; }
.tgl:active .sw::after { width: 17px; }
.tgl.on .sw { background: var(--accent); border-color: var(--accent); }
.tgl.on .sw::after { left: 23px; background: var(--on-accent); }
.tgl.on:hover .sw { background: var(--accent-hover); }
.tgl.on:hover .sw::after { left: 22px; }
.tgl.on:active .sw::after { left: 19px; }

.btn { height: 32px; min-width: 120px; padding: 0 11px 1px; border-radius: var(--radius); border: 1px solid var(--ctl-stroke); border-bottom-color: var(--ctl-stroke-bottom); background: var(--ctl); color: var(--text); cursor: default; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.sm { min-width: 0; }
.btn:hover { background: var(--ctl-hover); }
.btn:active { background: var(--ctl-press); color: var(--text2); border-bottom-color: var(--ctl-stroke); }
.btn.pri { background: var(--accent); color: var(--on-accent); border-color: rgba(255,255,255,.08); border-bottom-color: rgba(0,0,0,.4); }
.btn.pri:hover { background: var(--accent-hover); }
.btn.pri:active { background: var(--accent-press); color: var(--on-accent); opacity: .85; }
.btn .g { font-size: 14px; }
.btn.icon { min-width: 32px; width: 32px; padding: 0; }
.btn.subtle { background: transparent; border-color: transparent; }
.btn.subtle:hover { background: var(--subtle-hover); }

.sel { height: 32px; min-width: 120px; padding: 0 11px 0 11px; border-radius: var(--radius); border: 1px solid var(--ctl-stroke); border-bottom-color: var(--ctl-stroke-bottom); background: var(--ctl); color: var(--text); display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; cursor: default; white-space: nowrap; }
.sel:hover { background: var(--ctl-hover); }
.sel:active { background: var(--ctl-press); color: var(--text2); }
.sel .g { font-size: 12px; color: var(--text2); margin-right: 1px; }
.sel.w200 { min-width: 200px; }

.flyout { position: fixed; z-index: 60; background: var(--flyout); border: 1px solid var(--flyout-stroke); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 2px 0; animation: fly .2s cubic-bezier(0,0,0,1); max-height: 70vh; overflow: auto; }
@keyframes fly { from { opacity: 0; transform: scaleY(.85); } to { opacity: 1; transform: none; } }
.flyout .opt { position: relative; height: 32px; margin: 4px; padding: 0 12px; display: flex; align-items: center; border-radius: var(--radius); cursor: default; white-space: nowrap; gap: 12px; }
.flyout .opt:hover { background: var(--subtle-hover); }
.flyout .opt:active { background: var(--subtle-press); color: var(--text2); }
.flyout .opt.sel-o { background: var(--subtle-hover); }
.flyout .opt.sel-o::before { content: ""; position: absolute; left: 0; top: 8px; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; }
.flyout .opt .g { font-size: 16px; }
.flyout .sepline { height: 1px; background: var(--divider); margin: 2px 0; }

.slider { display: flex; align-items: center; gap: 12px; color: var(--text); }
.slider .g { font-size: 16px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 200px; height: 32px; background: transparent; margin: 0; --p: 50%; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p), var(--ctl-strong) var(--p)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; margin-top: -8px; background: var(--accent); border: 4px solid var(--flyout); box-shadow: 0 0 0 1px var(--ctl-stroke); transition: border-width .1s; }
input[type=range]:hover::-webkit-slider-thumb { border-width: 3px; }
input[type=range]:active::-webkit-slider-thumb { border-width: 5px; }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--ctl-strong); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--accent); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 4px solid var(--flyout); }
.slider .num { min-width: 24px; text-align: right; color: var(--text2); }

.chk { display: flex; align-items: center; gap: 8px; cursor: default; min-height: 32px; }
.chk .box { width: 20px; height: 20px; border-radius: var(--radius); border: 1px solid var(--ctl-strong); background: rgba(0,0,0,.024); display: grid; place-items: center; font-family: var(--icons); font-size: 12px; color: transparent; flex: none; }
.chk:hover .box { background: var(--subtle-hover); }
.chk.on .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rad { display: flex; align-items: center; gap: 8px; cursor: default; min-height: 32px; }
.rad .dot { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--ctl-strong); background: rgba(0,0,0,.024); position: relative; flex: none; }
.rad.on .dot { border: 5px solid var(--accent); background: var(--on-accent); }
.rad:hover:not(.on) .dot { background: var(--subtle-hover); }
.rad.on:hover .dot { border-width: 4px; }

.txtbox { height: 32px; border-radius: var(--radius); border: 1px solid var(--ctl-stroke); border-bottom-color: var(--ctl-strong); background: var(--input-bg); color: var(--text); font: inherit; padding: 0 11px 2px; outline: none; min-width: 240px; }
.txtbox:focus { background: var(--input-focus); border-bottom: 2px solid var(--accent); padding-bottom: 1px; }
.txtbox::placeholder { color: var(--text2); }

.hyper { color: var(--accent-text); cursor: pointer; text-decoration: none; }
.hyper:hover { text-decoration: underline; }
.badge { font-size: 12px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); line-height: 16px; }

/* Related / help footer */
.footer { margin-top: 28px; display: flex; flex-direction: column; gap: 6px; }
.footer a { display: inline-flex; align-items: center; gap: 12px; color: var(--accent-text); cursor: pointer; width: max-content; }
.footer a:hover span:last-child { text-decoration: underline; }
.footer a .g { font-size: 16px; color: var(--text); }

/* ===== Hero / custom blocks ===== */
.hero { display: flex; gap: 24px; align-items: center; margin-bottom: 28px; flex-wrap: wrap; }
.dev-hero { display: flex; align-items: center; gap: 20px; flex: 1; min-width: 320px; }
.dev-thumb { width: 200px; height: 112px; border-radius: 6px; position: relative; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--card-stroke); border: 6px solid #111; border-bottom-width: 7px; }
.dev-thumb .wp { position: absolute; inset: 0; }
.dev-thumb .tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: rgba(32,32,32,.82); display: flex; justify-content: center; gap: 3px; align-items: center; }
.dev-thumb .tbar i { width: 5px; height: 5px; border-radius: 1px; background: rgba(255,255,255,.7); }
.dev-thumb .tbar i:first-child { background: #3aa0ff; }
.dev-name { font-family: var(--font-display); font-size: 20px; line-height: 28px; font-weight: 600; }
.dev-model { color: var(--text2); }
.hero-tiles { display: flex; gap: 12px; flex-wrap: wrap; }
.tile { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-width: 220px; min-height: 64px; border-radius: var(--radius); }
.tile.click:hover { background: var(--card-hover); }
.tile .g { font-size: 24px; }
.tile .imgico { width: 28px; height: 28px; }
.tile .t1 { font-weight: 600; }
.tile .t2 { font-size: 12px; color: var(--text2); line-height: 16px; }

/* Wallpaper art (CSS approximations) */
.wp-bloom-dark { background: radial-gradient(ellipse 60% 85% at 52% 62%, #4fa3ff 0%, #2368e0 22%, #1a3fa8 40%, transparent 62%), radial-gradient(ellipse 45% 70% at 38% 72%, #6a5cff 0%, transparent 55%), radial-gradient(ellipse 40% 60% at 68% 70%, #3b7bff 0%, transparent 55%), linear-gradient(180deg, #0b1532 0%, #0a1a46 50%, #0d2b6b 100%); }
.wp-bloom-light { background: radial-gradient(ellipse 60% 85% at 52% 62%, #2d7ff9 0%, #5aa2ff 22%, #a9d0ff 42%, transparent 64%), radial-gradient(ellipse 45% 70% at 38% 72%, #7b8cff 0%, transparent 55%), linear-gradient(180deg, #dbe9fb 0%, #cfe3fb 50%, #b7d4f7 100%); }
.wp-glow { background: radial-gradient(circle at 50% 55%, #ffc4e8 0%, #d55bd6 18%, #6e1fa8 45%, #1d0742 75%); }
.wp-motion { background: radial-gradient(ellipse 90% 40% at 50% 60%, #ff9a5a 0%, #e9475e 30%, transparent 60%), linear-gradient(160deg, #351049 0%, #20093a 60%, #0c0420 100%); }
.wp-sunrise { background: radial-gradient(ellipse 80% 60% at 50% 100%, #ffd27a 0%, #ff8f5e 35%, #b2577f 60%, #3f3769 85%); }
.wp-flow { background: radial-gradient(ellipse 80% 60% at 30% 40%, #77e3d0 0%, transparent 60%), radial-gradient(ellipse 70% 60% at 70% 70%, #1f9fd6 0%, transparent 60%), linear-gradient(135deg, #0d5873 0%, #0a3a5a 100%); }
.wp-sand { background: linear-gradient(170deg, #f5d6a8 0%, #e6a96b 45%, #a3633a 100%); }
.wp-lake { background: linear-gradient(180deg, #8fb7d6 0%, #c9dbe6 45%, #3d6c86 46%, #1d3c4f 100%); }
.wp-solid { background: #0063b1; }

/* Personalization preview */
.pers-hero { display: flex; gap: 24px; margin-bottom: 28px; align-items: stretch; flex-wrap: wrap; }
.big-preview { width: 352px; height: 198px; border-radius: 8px; position: relative; overflow: hidden; flex: none; border: 8px solid #101010; border-radius: 10px; }
.big-preview .win { position: absolute; left: 30%; top: 22%; width: 46%; height: 52%; border-radius: 4px; background: var(--bg); box-shadow: 0 4px 10px rgba(0,0,0,.35); padding: 8px; }
.big-preview .win i { display: block; height: 6px; border-radius: 3px; background: var(--text3); margin-bottom: 6px; width: 60%; opacity: .6; }

<script>
/* Windows 11 Settings replica – page content.

/* ---- Device profile (edit freely) ---- */
const DEVICE = {
  name: 'DESKTOP-PC',

  accent: '#0078D4',

const page = (id, title, parent, items, o = {}) => (PAGES[id] = { id, title, parent, items, ...o });

const support = (title, links) => [GR('Related support'), X('E897', 'Help with ' + title, '', null, links.map(sl), true)];

/* ---- Navigation pane ---- */

  { id: 'home', title: 'Home', svg: ni('E80F', '#ffb35c', '#f06a2e') },
  { id: 'system', title: 'System', svg: ni('E7F4', '#6cc4ff', '#1a73e8') },

  { id: 'accounts', title: 'Accounts', svg: ni('E77B', '#6de39b', '#1f9e5a') },
  { id: 'time', title: 'Time & language', svg: ni('E775', '#6cc4ff', '#2a7ed3') },

/* ---------- Pro: section tabs ---------- */
// Each Pro category becomes a tab bar. "Most used" is the first tab; then one tab per section (or per heading,
// where the standard page groups its sections under headings). Inside a tab, submenus become headed groups.
function flatSec(sec, path, out) {

  if (rows.length) { if (path) out.push({ t: 'grp', h: path }); rows.forEach(r => out.push(r)); }
  sec.items.filter(x => x.t === 'sec').forEach(s => flatSec(s, path ? path + ' › ' + s.h : s.h, out));

function proTabs(p) {

document.addEventListener('keydown', e => { const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName); if ((e.ctrlKey && e.key.toLowerCase() === 'f') || (e.key === '/' && !typing)) { e.preventDefault(); q.focus(); q.select(); } });

PAGES.search = { id: 'search', title: 'Search results', parent: null, noFooter: true, items: () => {
  const hits = runSearch(state.searchQ || '', 60);
  if (!hits.length) return [{ t: 'para', t2: 'No results found. Try fewer words, or another name for the setting.' }];
  return hits.map(h => ({ t: 'row', i: h.g, h: h.label, d: esc(whereText(h)), act: 'searchgo', hit: h }));
} };
function crumbText(id) { const out = []; let p = getPage(id); while (p) { out.unshift(p.title); p = p.parent ? getPage(p.parent) : null; } return out.join(' › '); }
window.settingsNav = navigate; // handy for testing/demos
/* ---------- Boot ---------- */
(function seedFlags() {
  const seen = new Set();
  const visit = o => { if (!o || typeof o !== 'object' || seen.has(o)) return; seen.add(o); if (Array.isArray(o)) return o.forEach(visit);
    if (o.key && !(o.key in state.f)) state.f[o.key] = o.k === 'select' || o.t === 'radios' ? o.opts[o.i] : !!o.on;
    Object.values(o).forEach(visit); };
  Object.values(PAGES).forEach(p => visit(typeof p.items === 'function' ? null : p.items));
})();
state.mode = DEVICE.darkMode ? 'Dark' : 'Light';
try { Object.assign(state, JSON.parse(localStorage.getItem('w11s') || '{}')); } catch (e) {}
applyTheme();
/* ---------- Pro user interface switch ---------- */
const start = location.hash.slice(1);
try { state.pro = localStorage.getItem('w11pro') === '1'; } catch (e) {}
// Pitch concepts, switched on with ?x=tiles,side,quiet (any combination)
// Default: vertical tabs with the Most used panel; ?x= replaces the defaults
try { const xq = new URLSearchParams(location.search).get('x'); (xq !== null && xq !== '' ? xq : 'side').split(',').filter(Boolean).forEach(x => document.body.classList.add('x-' + x)); } catch (e) {}
// Updated-mode layout variant (a = calm panel, b = Most used on demand); ?lay= overrides the saved one
try { const q = new URLSearchParams(location.search).get('lay'); document.body.dataset.lay = q !== null ? q : (localStorage.getItem('w11lay') || ''); } catch (e) {}
if (PAGES[start] && PAGES[start].pro) state.pro = true;
const proSw = document.createElement('button');
proSw.className = 'pro-sw'; proSw.id = 'prosw'; proSw.title = 'Switch between the standard and Updated layout';
proSw.innerHTML = '<span class="lbl">Updated</span><span class="sw"></span>';
$('.tb-title').after(proSw);
function setPro(on) {
  state.pro = on;
  document.body.classList.toggle('pro', on);
  proSw.classList.toggle('on', on); proSw.setAttribute('aria-pressed', on);
  try { localStorage.setItem('w11pro', on ? '1' : '0'); } catch (e) {}
}
proSw.onclick = e => {
  e.stopPropagation();
  const top = topOf(state.page);
  const proTop = Object.entries(PRO_MAP);
  let dest;
  if (!state.pro) dest = PRO_MAP[top] || 'home';
  else dest = (proTop.find(([s, p]) => p === top) || ['home'])[0];
  setPro(!state.pro);
  renderNav();
  state.history = []; $('#back').disabled = true;
  navigate(dest, { back: true });
  toast(state.pro ? 'Updated mode on' : 'Updated mode off');
};
setPro(!!state.pro);
renderNav();
state.page = PAGES[start] && inMode(start) ? start : 'home';
render();
setInterval(() => { const c = $('#clock'); if (c) c.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }, 10000);
})();
